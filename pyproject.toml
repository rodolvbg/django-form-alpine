[build-system]
build-backend = "hatchling.build"
requires = [ "hatchling" ]

[project]
name = "django-form-alpine"
version = "0.0.5"
description = "Integrate Alpine.js into Django forms declaratively using widget attrs and resolvers"
readme = { file = "README.md", content-type = "text/markdown" }
keywords = [ "alpine", "alpinejs", "django", "django-admin", "form" ]
license = "MIT"
license-files = [ "LICENSE" ]
maintainers = [ { name = "Rodolfo Valentín Becerra García", email = "rodolvbg@gmail.com" } ]
authors = [ { name = "Rodolfo Valentín Becerra García", email = "rodolvbg@gmail.com" } ]
requires-python = ">=3.9"
classifiers = [
  "Framework :: Django",
  "Framework :: Django :: 3.2",
  "Framework :: Django :: 4.0",
  "Framework :: Django :: 4.1",
  "Framework :: Django :: 4.2",
  "Framework :: Django :: 5.0",
  "Framework :: Django :: 5.1",
  "Framework :: Django :: 5.2",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "django>=3.2",
]
optional-dependencies.dev = [
  "django-stubs[compatible-mypy]>=5",
  "mypy>=1.10",
  "playwright>=1.41",
  "pre-commit>=3.6",
  "pytest>=8",
  "pytest-cov>=5",
  "pytest-django>=4.8",
  "pytest-playwright>=0.5",
  "ruff>=0.2",
]
urls.Homepage = "https://django-form-alpine.readthedocs.io/en/latest/"
urls.Issues = "https://github.com/rodolvbg/django-form-alpine/issues"
urls.Repository = "https://github.com/rodolvbg/django-form-alpine"

[dependency-groups]
dev = [
  "django-stubs[compatible-mypy]>=5",
  "mypy>=1.10",
  "playwright>=1.41",
  "pre-commit>=3.6",
  "pytest>=8",
  "pytest-cov>=5",
  "pytest-django>=4.8",
  "pytest-playwright>=0.5",
  "ruff>=0.2",
]

[tool.hatch]
build.targets.wheel.packages = [ "src/django_form_alpine" ]

[tool.ruff]
target-version = "py39"
line-length = 88
# docs/ is the Sphinx/ReadTheDocs site (out of scope for this tooling
# standardization) and README.md ships as-is on PyPI; ruff's formatter can
# reformat embedded Python code fences in Markdown, which would otherwise
# touch both.
extend-exclude = [ "docs", "README.md" ]
lint.select = [ "B", "DJ", "E", "F", "I", "UP", "W" ]
lint.ignore = [ "E203" ]

[tool.mypy]
mypy_path = "src:example"
# mypy itself only supports checking down to 3.10 (this package's actual
# requires-python floor of 3.9 in [project] is unaffected by this setting).
python_version = "3.10"
warn_redundant_casts = true
warn_unused_ignores = true
plugins = [ "mypy_django_plugin.main" ]

[tool.django-stubs]
django_settings_module = "tests.settings"

[tool.pytest]
ini_options.pythonpath = [ "src", "." ]
ini_options.python_files = [ "*_tests.py", "test_*.py", "tests.py" ]
ini_options.addopts = "--cov=django_form_alpine --cov-report=term-missing"
ini_options.DJANGO_SETTINGS_MODULE = "tests.settings"

[tool.coverage]
run.source = [ "django_form_alpine" ]
report.show_missing = true
report.skip_covered = true
