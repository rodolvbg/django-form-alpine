exclude: "alpine\\.js$"

repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
  hooks:
  - id: check-added-large-files
  - id: check-case-conflict
  - id: check-json
  - id: check-merge-conflict
  - id: check-symlinks
  - id: check-toml
  - id: debug-statements
  - id: end-of-file-fixer
  - id: trailing-whitespace

- repo: https://github.com/biomejs/pre-commit
  rev: bc3c1d9acd69eaa1e5912f282ca563f914fd78d3  # frozen: v2.6.4
  hooks:
  - id: biome-check
    additional_dependencies:
    - '@biomejs/biome@2.3.8'
    language_version: default

- repo: https://github.com/adamchainz/django-upgrade
  rev: 5a815b88d9286ba45b8c1a4b56e695ff5645c65e  # frozen: 1.33.0
  hooks:
  - id: django-upgrade
    args: [--target-version, "3.2"]

- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: c0f278f1254ccc8fb09676bcdb8d847e7db493e5  # frozen: v0.17.4
  hooks:
  - id: ruff-check
    args: [--fix]
  - id: ruff-format

- repo: local
  hooks:
  - id: mypy
    name: mypy
    entry: mypy
    language: python
    additional_dependencies:
    - mypy>=1.10
    - django-stubs[compatible-mypy]>=5
    - django>=3.2
    - pytest-django>=4.8
    types: [python]
    files: ^(src|example)/
    pass_filenames: false
    args: [src/django_form_alpine, example]

- repo: https://github.com/tox-dev/pyproject-fmt
  rev: 3c6e76e10abcae02303212289efed3413350769c  # frozen: v2.30.6
  hooks:
  - id: pyproject-fmt
